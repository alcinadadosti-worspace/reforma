# Blueprint do Render: site estático, sem servidor. Toda a análise das notas roda no navegador.
# No Render: New > Blueprint > escolher este repositório.
services:
  - type: web
    runtime: static
    name: auditor-notas-rtc
    buildCommand: node build.mjs
    staticPublishPath: ./public
    headers:
      # connect-src 'none': a página não consegue enviar nada para servidor nenhum.
      # Scripts só do próprio HTML e do cdnjs (pdf.js, com SRI); estilos e fontes do Google Fonts.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow"
